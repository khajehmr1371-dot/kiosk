name: Android TV R111 audio build (intermediate, not for installation)
on:
  push:
    paths:
      - '.github/workflows/android-tv-audio-r111.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and verify original source
        shell: bash
        run: |
          set -euo pipefail
          echo 'db784dc944be38958e2fe36184cd73ecd4ae1f9511fe4a8d545fc198174ba23a  android-source/Bastiyan-Kiosk-AndroidTV-Native-R105-SOURCE.zip' | sha256sum -c
          unzip -q android-source/Bastiyan-Kiosk-AndroidTV-Native-R105-SOURCE.zip -d "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source/Bastiyan-Android-TV-Native-R105"
          patch --batch -p1 < "$GITHUB_WORKSPACE/android-r107/connection-fix.patch"
      - name: Apply destination audio fix and test playback plan
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source/Bastiyan-Android-TV-Native-R105"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/ir/bastiyan/kiosk/display")
          a=p/"AudioAnnouncer.java"
          s=a.read_text()
          assert s.count("void play(int number,Completion cb)")==1
          s=s.replace("void play(int number,Completion cb)", "void play(int number,String room,int repeatCount,Completion cb)")
          old="""        callback=cb;
                  List<String> parts=Numbers.files(number);
                  for(int repetition=0;repetition<2;repetition++){
                      for(String part:parts)queue.add(part);
                      if(repetition==0)queue.add("");
                  }"""
          # Locate the precise existing sequence independent of indentation.
          start=s.index("        callback=cb;\n        List<String> parts=Numbers.files(number);")
          end=s.index("        remaining=queue.size();",start)
          s=s[:start]+"""        List<String> parts;
                  try{parts=AnnouncementParts.files(number,room,repeatCount);}
                  catch(IllegalArgumentException e){cb.finished(false,e.getMessage());return;}
                  callback=cb;
                  queue.addAll(parts);
          """+s[end:]
          a.write_text(s)
          (p/"AnnouncementParts.java").write_text("""package ir.bastiyan.kiosk.display;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          public final class AnnouncementParts {
            private AnnouncementParts(){}
            public static int roomNumber(String room){
              String text=room==null?"":room.trim();
              StringBuilder digits=new StringBuilder();
              for(int i=0;i<text.length();i++){
                int digit=Character.digit(text.charAt(i),10);
                if(digit>=0)digits.append(digit);
              }
              if(digits.length()==0||digits.length()>2)return 0;
              int n=Integer.parseInt(digits.toString());
              return n>=1&&n<=10?n:0;
            }
            public static List<String> files(int number,String room,int repeatCount){
              int n=roomNumber(room);
              if(n==0)throw new IllegalArgumentException("شماره اتاق پزشک باید از ۱ تا ۱۰ باشد؛ فایل صوتی مقصد نامعتبر است");
              List<String> one=Numbers.files(number);
              ArrayList<String> result=new ArrayList<>();
              int repeats=Math.max(1,Math.min(3,repeatCount));
              for(int i=0;i<repeats;i++){
                if(i>0)result.add("");
                result.addAll(one);
                result.add(String.format(Locale.ROOT,"audio/R%02d.mp3",n));
              }
              return result;
            }
          }
          """)
          m=p/"MainActivity.java"
          s=m.read_text()
          old="        announcer.play(number,(ok,why)->{"
          assert s.count(old)==1
          s=s.replace(old,"""        JSONObject settings=lastState==null?null:lastState.optJSONObject("settings");
                  JSONObject displaySettings=settings==null?null:settings.optJSONObject("displaySettings");
                  int repeatCount=displaySettings==null?(settings==null?2:settings.optInt("repeatCount",2)):displaySettings.optInt("repeatCount",settings.optInt("repeatCount",2));
                  String destination=call.optString("room","");
                  announcer.play(number,destination,repeatCount,(ok,why)->{""")
          m.write_text(s)
          g=Path("app/build.gradle")
          s=g.read_text().replace("versionCode 107","versionCode 111").replace("versionName '1.0.7-R107'","versionName '1.1.1-R111'")
          import re
          s=re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '1.1.1-R111'",s)
          s=s.replace("applicationId 'ir.bastiyan.kiosk.display'","applicationId 'ir.bastiyan.kiosk.display.stable'")
          assert "versionCode 111" in s and "display.stable" in s
          g.write_text(s)
          manifest=Path("app/src/main/AndroidManifest.xml")
          manifest.write_text(manifest.read_text().replace('android:label="باستیان | نمایشگر"','android:label="باستیان | نمایشگر پایدار"'))
          Path("AudioPlanTest.java").write_text("""import ir.bastiyan.kiosk.display.AnnouncementParts;
          import java.util.*;
          public class AudioPlanTest{
            public static void main(String[] args){
              int count=0;
              for(int room=1;room<=10;room++)for(int number:new int[]{1,12,50,51,123,9999})for(int r=1;r<=3;r++){
                List<String> clips=AnnouncementParts.files(number,"اتاق "+room,r);
                String dest=String.format(Locale.ROOT,"audio/R%02d.mp3",room);
                if(!clips.get(clips.size()-1).equals(dest)||Collections.frequency(clips,dest)!=r)throw new AssertionError(clips);
                count++;
              }
              if(!AnnouncementParts.files(12,"۳",2).equals(Arrays.asList("audio/N12.mp3","audio/R03.mp3","","audio/N12.mp3","audio/R03.mp3")))throw new AssertionError();
              System.out.println("PASS: "+count+" room/number/repeat cases");
            }
          }
          """)
          PY
          p=app/src/main/java/ir/bastiyan/kiosk/display
          mkdir -p "$RUNNER_TEMP/qa"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qa" "$p/Numbers.java" "$p/AnnouncementParts.java" AudioPlanTest.java
          java -cp "$RUNNER_TEMP/qa" AudioPlanTest
      - name: Install required SDK
        shell: bash
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release APK
        shell: bash
        run: |
          cd "$RUNNER_TEMP/source/Bastiyan-Android-TV-Native-R105"
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Export intermediate APK for offline sound asset merge and local signing
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/source/Bastiyan-Android-TV-Native-R105/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/R111-unsigned-intermediate.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" dist/zipalign
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > dist/badging.txt
          grep "package: name='ir.bastiyan.kiosk.display.stable'" dist/badging.txt
          grep "versionCode='111'" dist/badging.txt
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R111-intermediate-NOT-for-installation
          path: dist/*
          if-no-files-found: error
          retention-days: 1
